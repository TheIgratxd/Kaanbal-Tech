services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000

  ia:
    build:
      context: ./ia
    env_file:
      - ./ia/.env
    stdin_open: true
    tty: true
