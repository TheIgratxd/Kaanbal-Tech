services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      FRONTEND_URL: http://localhost:3000

  ia:
    build:
      context: ./ia
    env_file:
      - path: ./ia/.env
        required: false
    ports:
      - "8000:8000"
    environment:
      AWS_REGION: us-east-2
      PYTHONUNBUFFERED: 1
